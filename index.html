<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Babeng y las letras</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&family=Amiri+Quran&family=Noto+Naskh+Arabic:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff6dc;--ink:#1f2460;--card:#fff;--soft:#eadfbb;--glow:#ffc83d;--ok:#2fae8a;--bad:#e5586b;--btn:#1f2460;--btnink:#fff6dc;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141846;--ink:#fff3c9;--card:#222a7a;--soft:#3a44a6;--btn:#ffc83d;--btnink:#141846;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141846;--ink:#fff3c9;--card:#222a7a;--soft:#3a44a6;--btn:#ffc83d;--btnink:#141846;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Baloo 2",system-ui,sans-serif;font-size:1.15rem;line-height:1.35}
#app{max-width:480px;margin:0 auto;padding:18px 16px 40px}
h1{font-size:2rem;margin:0 0 4px}
p{margin:0 0 12px}
.ar{font-family:"Noto Naskh Arabic","Amiri",serif;direction:rtl;font-weight:700}
.firefly{font-size:2.6rem;display:inline-block;animation:glow 2.4s ease-in-out infinite}
@keyframes glow{50%{transform:translateY(-6px);filter:drop-shadow(0 0 10px var(--glow))}}
@media (prefers-reduced-motion:reduce){.firefly{animation:none}}
button{font:inherit;cursor:pointer;border:0;color:inherit}
button:focus-visible{outline:4px solid var(--glow);outline-offset:2px}
.lesson{display:grid;grid-template-columns:1fr auto;gap:2px 10px;width:100%;text-align:left;background:var(--card);border-radius:22px;padding:14px 18px;margin-bottom:12px;box-shadow:0 3px 0 var(--soft)}
.lesson .lt{font-family:"Noto Naskh Arabic",serif;font-size:1.9rem;direction:rtl;text-align:left;grid-column:1}
.lesson .st{grid-row:1/3;grid-column:2;font-size:2rem;align-self:center}
.big{background:var(--card);border-radius:28px;padding:12px 16px;text-align:center;margin-bottom:12px}
.big .ar{font-size:7rem;line-height:1.3;display:block}
.name{font-size:1.6rem;font-weight:700}
.word{font-size:1.4rem}
.row{display:flex;gap:10px;margin:10px 0}
.btn{flex:1;background:var(--btn);color:var(--btnink);border-radius:18px;padding:12px 14px;font-weight:700;font-size:1.1rem}
.btn.alt{background:var(--card);color:var(--ink);box-shadow:0 3px 0 var(--soft)}
canvas{width:100%;height:auto;aspect-ratio:3/2;background:var(--card);border-radius:24px;border:3px dashed var(--soft);touch-action:none;display:block}
.dots{display:flex;gap:6px;margin-bottom:12px}
.dots i{flex:1;height:8px;border-radius:4px;background:var(--soft)}
.dots i.on{background:var(--glow)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.opt{background:var(--card);border-radius:22px;padding:6px;font-family:"Noto Naskh Arabic",serif;font-size:4rem;line-height:1.5;box-shadow:0 3px 0 var(--soft)}
.opt.ok{background:var(--ok);color:#fff}
.opt.bad{background:var(--bad);color:#fff;animation:shake .3s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.back{background:none;font-size:1rem;padding:6px 0;text-decoration:underline}
.win{text-align:center;padding-top:30px}
.win .bigstar{font-size:6rem}
.note{font-size:.9rem;opacity:.75;margin-top:18px}
.opt.lat{font-family:"Baloo 2",sans-serif;font-size:1.9rem;line-height:1.8;padding:14px 6px}
.ay{display:block;width:100%;background:var(--card);border-radius:20px;padding:8px 16px;margin-bottom:10px;font-family:"Amiri Quran","Noto Naskh Arabic",serif;font-size:2.1rem;line-height:2.1;direction:rtl;text-align:right}.ay small{font-family:"Baloo 2",sans-serif;font-size:1rem;opacity:.7}.ay.on{background:var(--glow);color:#1f2460}
.toast{display:none;position:fixed;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--btn);color:var(--btnink);border-radius:16px;padding:12px 16px;font-size:1rem;z-index:5}
</style>
</head>
<body>
<div id="app"></div>
<div id="msg" class="toast" role="status"></div>
<script>
const L=[
 [["ا","Alif","ألف","Una rayita recta. Alarga el sonido «a».","أسد","león","🦁"],["ب","Bā","باء","Como la «b» de barco. Un punto abajo.","بيت","casa","🏠"],["ت","Tā","تاء","Como la «t» de taza. Dos puntos arriba.","تفاحة","manzana","🍎"],["ث","Thā","ثاء","Como la «z» de zapato (España). Tres puntos arriba.","ثعلب","zorro","🦊"]],
 [["ن","Nūn","نون","Como la «n» de nube. Un punto arriba.","نجمة","estrella","⭐"],["ي","Yā","ياء","Como la «y» de yate. Dos puntos abajo.","يد","mano","✋"],["ج","Jīm","جيم","Como la «j» inglesa de jam. Un punto dentro.","جمل","camello","🐪"],["ح","Ḥā","حاء","Un soplido fuerte desde la garganta. Sin punto.","حصان","caballo","🐴"]],
 [["خ","Khā","خاء","Como la «j» de jamón. Un punto arriba.","خروف","cordero","🐑"],["د","Dāl","دال","Como la «d» de dedo. Una curva.","دب","oso","🐻"],["ذ","Dhāl","ذال","La «d» suave de nada, con la lengua entre los dientes. Un punto.","ذرة","maíz","🌽"],["ر","Rā","راء","Como la «r» de pero. La lengua vibra una vez.","رمان","granada","🔴"]],
 [["ز","Zāy","زاي","Como el zumbido de una abeja. Un punto arriba.","زهرة","flor","🌸"],["س","Sīn","سين","Como la «s» de sol. Tres dientes.","سمكة","pez","🐟"],["ش","Shīn","شين","Como «¡shhh!» de silencio. Tres puntos arriba.","شمس","sol","☀️"],["ص","Ṣād","صاد","Una «s» fuerte y gruesa. Un óvalo.","صقر","halcón","🦅"]],
 [["ض","Ḍād","ضاد","Una «d» fuerte y gruesa. Un punto arriba.","ضفدع","rana","🐸"],["ط","Ṭā","طاء","Una «t» fuerte y gruesa. Un palito arriba.","طبل","tambor","🥁"],["ظ","Ẓā","ظاء","Una «dh» fuerte y gruesa. Un punto.","ظرف","sobre","✉️"],["ع","ʿAyn","عين","Sonido desde el fondo de la garganta. Sin punto.","عين","ojo","👁️"]],
 [["غ","Ghayn","غين","Como hacer gárgaras suavemente. Un punto arriba.","غيمة","nube","☁️"],["ف","Fā","فاء","Como la «f» de foca. Un punto arriba.","فيل","elefante","🐘"],["ق","Qāf","قاف","Una «k» desde el fondo de la garganta. Dos puntos arriba.","قمر","luna","🌙"],["ك","Kāf","كاف","Como la «k» de kilo. Una pequeña marca dentro.","كتاب","libro","📖"]],
 [["ل","Lām","لام","Como la «l» de luna. Un palito alto.","ليمون","limón","🍋"],["م","Mīm","ميم","Como la «m» de mamá. Una bolita.","موز","banana","🍌"],["ه","Hā","هاء","Una «h» suave, como un soplo ligero.","هلال","luna creciente","☪️"],["و","Wāw","واو","Como la «w» de web. Una cabecita redonda.","وردة","rosa","🌹"]]
].map(l=>l.map(a=>({c:a[0],n:a[1],s:a[2],t:a[3],w:a[4],wt:a[5],e:a[6]})));
let S={};try{S=JSON.parse(localStorage.getItem("nur")||"{}")}catch(e){}
const save=()=>{try{localStorage.setItem("nur",JSON.stringify(S))}catch(e){}};
const app=document.getElementById("app");
const shuf=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(p=>p[1]);
function msg(m){const n=document.getElementById("msg");n.textContent=m;n.style.display="block";clearTimeout(msg.t);msg.t=setTimeout(()=>n.style.display="none",6000)}
function say(t){try{const ss=speechSynthesis;ss.cancel();const u=new SpeechSynthesisUtterance(t);const vs=ss.getVoices();const v=vs.find(v=>/^ar/i.test(v.lang));if(v){u.voice=v;u.lang=v.lang}else{u.lang="ar-SA";msg("Este teléfono no tiene voz árabe. Instálala en Ajustes, Idioma, Voz.")}u.rate=.7;setTimeout(()=>ss.speak(u),80)}catch(e){msg("Este navegador no reproduce audio.")}}
let li=0,step=0,qs=[],qi=0;

function home(){
 if(!S.name){ask();return}
 if(!window._c){window._c=1;track("conexion")}
 const n=Object.keys(S).filter(k=>k!=="name").length;
 app.innerHTML=`<span class="firefly">✨</span><h1>Babeng y las letras</h1>
 <p>${S.name?`¡Hola, ${esc(S.name)}! Me alegra mucho verte. Soy Babeng y vamos a aprender juntos.`:"¡Hola! Soy Babeng."} Toca una lección para empezar. Llevas ${n} de ${L.length+R.length} estrellas.</p>`+
 L.map((l,i)=>`<button class="lesson" onclick="start(${i})"><span class="lt">${l.map(x=>x.c).join(" ")}</span><span>Lección ${i+1}</span><span class="st">${S[i]?"⭐":"☆"}</span></button>`).join("")+
 `${R.map((l,i)=>`<button class="lesson" onclick="rstart(${i})"><span class="lt" lang="ar">${l.s}</span><span>${l.t}</span><span class="st">${S["r"+i]?"⭐":"☆"}</span></button>`).join("")}<button class="lesson" onclick="rd(0)"><span class="lt" style="direction:ltr;font-family:inherit">Practica leer</span><span>3 textos cortos en árabe</span><span class="st">📝</span></button><button class="lesson" onclick="story(0)"><span class="lt" style="direction:ltr;font-family:inherit">Historia de Safi</span><span>8 textos cortos</span><span class="st">📚</span></button><p class="note">El audio usa la voz del teléfono. Puede fallar con algunos sonidos.</p><p class="note">Esta app guarda tu nombre, la hora en que entras y las lecciones que terminas. Tu maestro puede verlos.</p><button class="back" onclick="chName()">Cambiar nombre</button>`;
}
function start(i){li=i;step=0;card()}
function card(){
 const l=L[li],x=l[step];
 app.innerHTML=`<div class="top"><button class="back" onclick="home()">Inicio</button><span>Lección ${li+1}</span></div>
 <div class="dots">${l.map((_,k)=>`<i class="${k<=step?"on":""}"></i>`).join("")}</div>
 <div class="big"><span class="ar" lang="ar">${x.c}</span><div class="name">${x.n}</div><p>${x.t}</p>
 <div class="word">${x.e} <span class="ar" lang="ar">${x.w}</span> · ${x.wt}</div></div>
 <div class="row"><button class="btn" onclick="say('${x.s}')">🔊 Escuchar</button></div>
 <p>Traza la letra con el dedo:</p><canvas id="cv" width="600" height="400"></canvas>
 <div class="row"><button class="btn alt" onclick="trace('${x.c}')">Borrar</button><button class="btn" onclick="next()">${step<l.length-1?"Siguiente":"Jugar"}</button></div>`;
 trace(x.c);say(x.s);
}
function trace(ch){
 const cv=document.getElementById("cv"),g=cv.getContext("2d");
 const ghost=()=>{g.clearRect(0,0,600,400);g.fillStyle=getComputedStyle(document.body).getPropertyValue("--soft");g.font='700 300px "Noto Naskh Arabic",serif';g.textAlign="center";g.textBaseline="middle";g.fillText(ch,300,210)};
 ghost();if(document.fonts&&document.fonts.ready)document.fonts.ready.then(ghost);
 let d=false;const col=getComputedStyle(document.body).color;
 const pt=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*600/r.width,(e.clientY-r.top)*400/r.height]};
 cv.onpointerdown=e=>{d=true;cv.setPointerCapture(e.pointerId);const[p,q]=pt(e);g.strokeStyle=col;g.lineWidth=16;g.lineCap=g.lineJoin="round";g.beginPath();g.moveTo(p,q)};
 cv.onpointermove=e=>{if(!d)return;const[p,q]=pt(e);g.lineTo(p,q);g.stroke()};
 cv.onpointerup=cv.onpointercancel=()=>{d=false};
}
function next(){const l=L[li];if(step<l.length-1){step++;card()}else{qs=shuf(l);qi=0;quiz()}}
function quiz(){
 const t=qs[qi];
 app.innerHTML=`<div class="top"><button class="back" onclick="home()">Inicio</button><span>Juego ${qi+1} de ${qs.length}</span></div>
 <div class="dots">${qs.map((_,k)=>`<i class="${k<=qi?"on":""}"></i>`).join("")}</div>
 <div class="big"><p>Toca la letra</p><div class="name">${t.n}</div></div>
 <div class="row"><button class="btn alt" onclick="say('${t.s}')">🔊 Escuchar</button></div>
 <div class="opts">${shuf(L[li]).map(o=>`<button class="opt" lang="ar" data-c="${o.c}" onclick="pick(this)">${o.c}</button>`).join("")}</div>`;
 say(t.s);
}
function pick(b){
 if(b.dataset.c===qs[qi].c){b.classList.add("ok");document.querySelectorAll(".opt").forEach(o=>o.disabled=true);
  setTimeout(()=>{qi++;qi<qs.length?quiz():win()},700)}
 else{b.classList.add("bad");setTimeout(()=>b.classList.remove("bad"),400)}
}
function win(){
 S[li]=1;save();track("leccion","Lección "+(li+1)+": "+L[li].map(x=>x.n).join(", "));
 app.innerHTML=`<div class="win"><div class="bigstar">⭐</div><h1>¡Estrella ganada!</h1><p>Terminaste la lección ${li+1}. ¡Muy bien!</p>
 <div class="row">${li<L.length-1?`<button class="btn" onclick="start(${li+1})">Lección ${li+2}</button>`:""}<button class="btn alt" onclick="home()">Inicio</button></div></div>`;
}
const SU=[[1,"Al-Fātiḥa"],[108,"Al-Kawthar"],[103,"Al-ʿAṣr"],[110,"An-Naṣr"],[112,"Al-Ikhlāṣ"],[113,"Al-Falaq"],[114,"An-Nās"],[105,"Al-Fīl"],[106,"Quraysh"],[107,"Al-Māʿūn"]];
let au=null,ay=[],sn=0,all=false;
const p3=n=>String(n).padStart(3,"0");
function quran(){stopQ();app.innerHTML=`<div class="top"><button class="back" onclick="home()">Inicio</button><span>Corán</span></div><h1 class="ar" lang="ar">القرآن</h1><p>Elige una sura. Escucha al recitador y repite.</p>`+SU.map((s,i)=>`<button class="lesson" onclick="sura(${i})"><span class="lt" style="direction:ltr;font-family:inherit">${s[1]}</span><span>Sura ${s[0]}</span><span class="st">▶</span></button>`).join("")}
async function getSura(n){try{const c=localStorage.getItem("q"+n);if(c)return JSON.parse(c)}catch(e){}
 const r=await fetch(`https://api.alquran.cloud/v1/surah/${n}/quran-uthmani`);const j=await r.json();const a=j.data.ayahs.map(x=>x.text);
 if(n!=1&&a[0].replace(/[\u064B-\u065F\u0670]/g,"").startsWith("بسم الله"))a[0]=a[0].split(" ").slice(4).join(" ");
 try{localStorage.setItem("q"+n,JSON.stringify(a))}catch(e){}return a}
let AU=[],WE=null;
async function wEd(){if(WE)return WE;try{WE=localStorage.getItem("wed")}catch(e){}if(WE)return WE;
 const r=await fetch("https://api.quranhub.com/v1/edition?format=text");const j=await r.json();
 const e=j.data.find(x=>/warsh/i.test(x.identifier+(x.narratorIdentifier||"")+(x.name||"")+(x.englishName||"")));
 if(!e)throw 0;WE=e.identifier;try{localStorage.setItem("wed",WE)}catch(z){}return WE}
async function getW(n){try{const c=localStorage.getItem("w"+n);if(c){const o=JSON.parse(c);AU=o.a;return o.t}}catch(e){}
 const ed=await wEd();const rs=await Promise.all([fetch(`https://api.quranhub.com/v1/surah/${n}/${ed}`),fetch(`https://api.quranhub.com/v1/surah/${n}/ar.husary.warsh`)]);
 const jt=await rs[0].json(),ja=await rs[1].json();const t=jt.data.ayahs.map(x=>x.text),a=ja.data.ayahs.map(x=>x.audio);
 const nm=s=>s.replace(/[\u064B-\u065F\u0670\u06D6-\u06ED]/g,"").replace(/\u0671/g,"\u0627");
 if(n!=1&&nm(t[0]).startsWith("بسم الله"))t[0]=t[0].split(" ").slice(4).join(" ");
 if(t.length!==a.length)msg("El texto y el audio tienen distinto número de versos. Revísalo con un maestro.");
 AU=a;try{localStorage.setItem("w"+n,JSON.stringify({t,a}))}catch(e){}return t}
async function sura(i){stopQ();sn=i;const hd=`<div class="top"><button class="back" onclick="quran()">Suras</button><span>${SU[i][1]}</span></div>`;app.innerHTML=hd+"<p>Cargando…</p>";
 try{ay=await getW(SU[i][0])}catch(e){app.innerHTML=hd+"<p>No se pudo cargar el texto. Revisa tu internet.</p>";return}
 app.innerHTML=hd+`<div class="row"><button class="btn" onclick="playAy(0,true)">▶ Escuchar todo</button><button class="btn alt" onclick="stopQ()">⏹ Parar</button></div>`+ay.map((t,k)=>`<button class="ay" id="ay${k}" lang="ar" onclick="playAy(${k})">${t} <small>${k+1}</small></button>`).join("")+`<p class="note">Toca un verso para oírlo. Riwaya Warsh. Recitador: Mahmoud Khalil Al-Husary (QuranHub). Texto en revisión.</p>`}
function playAy(k,chain){stopQ(true);all=!!chain;document.querySelectorAll(".ay").forEach((e,j)=>e.classList.toggle("on",j===k));
 au=new Audio(AU[k]||"");au.onended=()=>{if(all&&k<ay.length-1)playAy(k+1,true);else stopQ()};au.onerror=()=>msg("No se pudo cargar el audio. Revisa tu internet.");au.play().catch(()=>msg("Toca de nuevo para reproducir."))}
function stopQ(keep){try{if(au){au.onended=au.onerror=null;au.pause();au=null}}catch(e){}all=false;if(!keep)document.querySelectorAll(".ay").forEach(e=>e.classList.remove("on"))}
const R=[
{t:"Fatḥa: la vocal «a»",s:"بَ",r:"La rayita encima de la letra se llama fatḥa. Suena «a». بَ = ba.",ex:[["بَ","ba"],["تَ","ta"],["ثَ","tha"],["نَ","na"],["مَ","ma"],["لَ","la"],["سَ","sa"],["كَ","ka"]]},
{t:"Kasra: la vocal «i»",s:"بِ",r:"La rayita debajo de la letra se llama kasra. Suena «i». بِ = bi.",ex:[["بِ","bi"],["تِ","ti"],["نِ","ni"],["مِ","mi"],["لِ","li"],["سِ","si"],["كِ","ki"],["رِ","ri"]]},
{t:"Ḍamma: la vocal «u»",s:"بُ",r:"El signo con forma de «w» pequeña encima se llama Ḍamma. Suena «u». بُ = bu.",ex:[["بُ","bu"],["تُ","tu"],["نُ","nu"],["مُ","mu"],["لُ","lu"],["سُ","su"],["كُ","ku"],["رُ","ru"]]},
{t:"Leer palabras con vocales cortas",s:"كَتَبَ",r:"Une las sílabas de derecha a izquierda. كَ + تَ + بَ = kataba.",ex:[["كَتَبَ","kataba"],["ذَهَبَ","dhahaba"],["فَتَحَ","fataḥa"],["جَلَسَ","jalasa"],["شَرِبَ","shariba"],["سَمِعَ","samiʿa"]]},
{t:"Vocales largas",s:"بَا",r:"Fatḥa + alif = «ā» larga. Kasra + yāʾ = «ī». Ḍamma + wāw = «ū». Se alargan dos tiempos.",ex:[["بَا","bā"],["بِي","bī"],["بُو","bū"],["تَا","tā"],["مِي","mī"],["لُو","lū"],["سَا","sā"],["كِي","kī"]]},
{t:"Sukūn: sin vocal",s:"بْ",r:"El circulito encima se llama sukūn. La letra suena sola, sin vocal. مَنْ = man.",ex:[["مَنْ","man"],["قَدْ","qad"],["لَمْ","lam"],["هَلْ","hal"],["بَلْ","bal"],["كَمْ","kam"]]},
{t:"Shadda: letra doble",s:"بَّ",r:"La shadda (una «w» pequeña) repite la letra dos veces. رَبَّ = rab-ba.",ex:[["رَبَّ","rabba"],["ثُمَّ","thumma"],["حَقَّ","ḥaqqa"],["عَدَّ","ʿadda"],["رَبِّ","rabbi"],["مَدَّ","madda"]]},
{t:"Tanwīn: «an, in, un»",s:"ـٌ",r:"Dos signos iguales al final de una palabra agregan una «n»: ـً an, ـٍ in, ـٌ un.",ex:[["كِتَابٌ","kitābun"],["كِتَابًا","kitāban"],["كِتَابٍ","kitābin"],["بَيْتٌ","baytun"],["بَيْتًا","baytan"],["بَيْتٍ","baytin"]]}
];
let ri=0,rs=0,rq=[],rqi=0;
const rtop=t=>`<div class="top"><button class="back" onclick="home()">Inicio</button><span>${t}</span></div>`;
const rar=t=>`<span class="ar" lang="ar" style="font-size:4.6rem;line-height:1.8">${t}</span>`;
function rstart(i){ri=i;rs=0;rcard()}
function rcard(){const l=R[ri];
 if(rs==0){app.innerHTML=rtop(l.t)+`<div class="big">${rar(l.s)}<p>${l.r}</p></div><div class="row"><button class="btn" onclick="rs=1;rcard()">Empezar</button></div>`;return}
 const x=l.ex[rs-1];
 app.innerHTML=rtop(l.t)+`<div class="dots">${l.ex.map((_,k)=>`<i class="${k<rs?"on":""}"></i>`).join("")}</div><div class="big">${rar(x[0])}<div class="name">${x[1]}</div></div><div class="row"><button class="btn alt" onclick="say('${x[0]}')">🔊 Escuchar</button><button class="btn" onclick="rnext()">${rs<l.ex.length?"Siguiente":"Jugar"}</button></div>`;say(x[0])}
function rnext(){if(rs<R[ri].ex.length){rs++;rcard()}else{rq=shuf(R[ri].ex).slice(0,5);rqi=0;rquiz()}}
